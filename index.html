<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MySite</title>
  <link rel="icon" href="assets/favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000; --card: #111; --border: #222;
      --accent: #6c63ff;
      --green: #00e5a0; --blue: #38c6ff; --orange: #ff9b3a; --red: #ff5e6c; --lavender: #b39ddb;
      --text: #eeeef5; --muted: #666;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    /* ── BREAKING NEWS ── */
    #news-bar {
      position: sticky; top: 0; z-index: 300;
      height: 36px; display: flex; align-items: center;
      background: #b91c1c; overflow: hidden;
    }
    .news-label {
      flex-shrink: 0; height: 100%; display: flex; align-items: center;
      padding: 0 1rem; background: #7f1d1d;
      font-size: 0.72rem; font-weight: 800; letter-spacing: 0.12em;
      text-transform: uppercase; color: #fff; white-space: nowrap; gap: 0.4rem;
    }
    .news-track-wrap { flex: 1; overflow: hidden; }
    .news-track { display: inline-flex; white-space: nowrap; animation: ticker 50s linear infinite; }
    .news-track:hover { animation-play-state: paused; }
    .news-item { font-size: 0.8rem; color: #fff; padding: 0 2.5rem; display: inline-flex; align-items: center; gap: 0.5rem; }
    .news-item::before { content: '●'; font-size: 0.45rem; opacity: 0.6; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ── WEATHER ── */
    #weather { padding: 1.5rem 1.25rem; }

    .wx-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem; margin-bottom: 1.25rem;
    }
    .wx-loc-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 0.2rem; }
    .wx-loc-name  { font-size: 1.4rem; font-weight: 800; color: #c5beff; }

    .wx-search { display: flex; align-items: center; gap: 0.5rem; position: relative; }
    #city-input {
      background: #111; border: 1px solid var(--border); border-radius: 8px;
      padding: 0.5rem 0.9rem; color: var(--text); font-size: 0.85rem;
      width: 200px; outline: none; font-family: inherit;
    }
    #city-input:focus { border-color: var(--accent); }
    #city-input::placeholder { color: var(--muted); }
    #city-btn {
      background: var(--accent); border: none; border-radius: 8px; color: #fff;
      font-size: 0.85rem; font-weight: 700; padding: 0.5rem 1rem;
      cursor: pointer; font-family: inherit;
    }
    #city-btn:hover { opacity: 0.85; }

    #suggestions {
      position: absolute; top: calc(100% + 6px); left: 0; width: 290px;
      background: #1a1a1a; border: 1px solid var(--border); border-radius: 10px;
      overflow: hidden; z-index: 999; display: none;
      box-shadow: 0 12px 32px rgba(0,0,0,0.8);
    }
    .sug-item { padding: 0.6rem 1rem; cursor: pointer; border-bottom: 1px solid var(--border); }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: rgba(108,99,255,0.15); }
    .sug-name   { font-size: 0.85rem; font-weight: 600; }
    .sug-detail { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }

    /* Weather cards grid */
    .wx-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
      gap: 1rem;
    }
    .wx-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.25rem;
      display: flex; flex-direction: column; gap: 0.4rem;
    }
    .wx-card-label { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.12em; }
    .wx-card-icon  { font-size: 2.2rem; line-height: 1; margin: 0.25rem 0; }
    .wx-card-main  { font-size: 1.9rem; font-weight: 900; line-height: 1; }
    .wx-card-sub   { font-size: 0.8rem; color: var(--muted); }
    .wx-card-extra { font-size: 0.78rem; color: var(--muted); margin-top: 0.2rem; border-top: 1px solid var(--border); padding-top: 0.4rem; }

    .wx-temp  { border-color: rgba(255,94,108,0.3); }
    .wx-temp  .wx-card-label { color: var(--red); }
    .wx-temp  .wx-card-main  { color: #ff9aa3; }

    .wx-feel  { border-color: rgba(255,155,58,0.3); }
    .wx-feel  .wx-card-label { color: var(--orange); }
    .wx-feel  .wx-card-main  { color: #ffc07a; }

    .wx-rain  { border-color: rgba(56,198,255,0.3); }
    .wx-rain  .wx-card-label { color: var(--blue); }
    .wx-rain  .wx-card-main  { color: #8ddcff; }

    .wx-wind  { border-color: rgba(0,229,160,0.3); }
    .wx-wind  .wx-card-label { color: var(--green); }
    .wx-wind  .wx-card-main  { color: #7fffd4; }

    .wx-cond  { border-color: rgba(179,157,219,0.3); }
    .wx-cond  .wx-card-label { color: var(--lavender); }
    .wx-cond  .wx-card-main  { color: #d8ccff; font-size: 1.15rem; }

    .wx-sun   { border-color: rgba(255,200,50,0.3); }
    .wx-sun   .wx-card-label { color: #fcd34d; }
    .wx-sun   .wx-card-main  { color: #fde68a; font-size: 1.2rem; }

    .wx-msg { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }
  </style>
</head>
<body>

  <!-- BREAKING NEWS -->
  <div id="news-bar">
    <div class="news-label">&#128308; Breaking News</div>
    <div class="news-track-wrap">
      <div class="news-track" id="news-track"></div>
    </div>
  </div>

  <!-- WEATHER -->
  <section id="weather">
    <div class="wx-header">
      <div>
        <div class="wx-loc-label">Local Weather</div>
        <div class="wx-loc-name" id="wx-loc">Detecting location…</div>
      </div>
      <div class="wx-search">
        <input id="city-input" type="text" placeholder="Search city, town, village…" autocomplete="off" />
        <button id="city-btn">Go</button>
        <div id="suggestions"></div>
      </div>
    </div>
    <div class="wx-grid" id="wx-grid">
      <p class="wx-msg" id="wx-msg">Loading weather…</p>
    </div>
  </section>

  <script>
  // Breaking News
  const HEADLINES = [
    'Scientists discover new exoplanet that may support liquid water',
    'Global leaders gather for emergency climate summit in Geneva',
    'Tech giant unveils next-generation AI chip with record performance',
    'Central banks signal potential rate cuts amid cooling inflation',
    'Historic peace agreement signed between rival factions',
    'Researchers develop breakthrough treatment for rare genetic disease',
    'Space agency confirms successful launch of deep-space telescope',
    'Record-breaking heatwave sweeps across multiple continents',
    'Major earthquake strikes Pacific Rim — tsunami warnings issued',
    'Stock markets reach all-time high as earnings season begins',
    'New cybersecurity vulnerability found in widely-used software',
    'International team completes first crewed mission around the Moon',
  ];
  document.getElementById('news-track').innerHTML =
    [...HEADLINES,...HEADLINES].map(h => `<span class="news-item">${h}</span>`).join('');

  // Weather
  const WMO = {
    0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',
    45:'Foggy',48:'Icy fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
    61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',
    75:'Heavy snow',77:'Snow grains',80:'Light showers',81:'Showers',82:'Heavy showers',
    85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorm',96:'Thunderstorm+hail',99:'Heavy thunderstorm'
  };
  const ICONS = {
    0:'☀️',1:'🌤️',2:'⛅',3:'☁️',45:'🌫️',48:'🌫️',51:'🌦️',53:'🌦️',55:'🌧️',
    61:'🌧️',63:'🌧️',65:'🌧️',71:'🌨️',73:'❄️',75:'❄️',77:'❄️',80:'🌦️',
    81:'🌦️',82:'⛈️',85:'🌨️',86:'🌨️',95:'⛈️',96:'⛈️',99:'⛈️'
  };
  const WDIRS = ['N','NE','E','SE','S','SW','W','NW'];
  const wdir = d => WDIRS[Math.round(d/45)%8];
  const c2f  = c => ((c*9/5)+32).toFixed(1);
  const uvLv = u => u<=2?'Low':u<=5?'Moderate':u<=7?'High':u<=10?'Very High':'Extreme';

  function renderWeather(cw, hourly, daily, place) {
    document.getElementById('wx-loc').textContent = place;
    const h    = new Date().getHours();
    const feel = hourly?.apparent_temperature?.[h];
    const prec = hourly?.precipitation_probability?.[h] ?? '—';
    const hum  = hourly?.relative_humidity_2m?.[h] ?? '—';
    const vis  = hourly?.visibility?.[h];
    const uv   = daily?.uv_index_max?.[0];
    const code = cw.weathercode;
    const rise = daily?.sunrise?.[0]?.split('T')[1] ?? '—';
    const set  = daily?.sunset?.[0]?.split('T')[1] ?? '—';
    const maxT = daily?.temperature_2m_max?.[0];
    const minT = daily?.temperature_2m_min?.[0];

    document.getElementById('wx-grid').innerHTML = `
      <div class="wx-card wx-temp">
        <span class="wx-card-label">🌡️ Temperature</span>
        <span class="wx-card-icon">${ICONS[code]??'🌡️'}</span>
        <span class="wx-card-main">${c2f(cw.temperature)}°F</span>
        <span class="wx-card-sub">${cw.temperature}°C</span>
        <span class="wx-card-extra" style="color:#ffc07a">Feels like: ${feel!=null?c2f(feel)+'°F / '+feel+'°C':'—'}</span>
        <span class="wx-card-extra">High: ${maxT!=null?c2f(maxT)+'°F':'—'} &nbsp;·&nbsp; Low: ${minT!=null?c2f(minT)+'°F':'—'}</span>
      </div>
      <div class="wx-card wx-rain">
        <span class="wx-card-label">🌧️ Precipitation</span>
        <span class="wx-card-icon">💧</span>
        <span class="wx-card-main">${prec}%</span>
        <span class="wx-card-sub">Chance of rain</span>
        <span class="wx-card-extra">Humidity: ${hum}%</span>
      </div>
      <div class="wx-card wx-wind">
        <span class="wx-card-label">💨 Wind</span>
        <span class="wx-card-icon">🌬️</span>
        <span class="wx-card-main">${cw.windspeed}<span style="font-size:1rem"> km/h</span></span>
        <span class="wx-card-sub">Direction: ${wdir(cw.winddirection)}</span>
        <span class="wx-card-extra">${cw.windspeed < 20 ? 'Light breeze' : cw.windspeed < 40 ? 'Moderate wind' : 'Strong wind'}</span>
      </div>
      <div class="wx-card wx-cond">
        <span class="wx-card-label">🌤️ Condition</span>
        <span class="wx-card-icon">${ICONS[code]??'🌡️'}</span>
        <span class="wx-card-main">${WMO[code]??'Unknown'}</span>
        <span class="wx-card-sub">UV: ${uv!=null?uv+' — '+uvLv(uv):'—'}</span>
        <span class="wx-card-extra">Visibility: ${vis!=null?(vis/1000).toFixed(1)+' km':'—'}</span>
      </div>
      <div class="wx-card wx-sun">
        <span class="wx-card-label">🌅 Sun</span>
        <span class="wx-card-icon">☀️</span>
        <span class="wx-card-main">Rise ${rise}</span>
        <span class="wx-card-sub">Set ${set}</span>
        <span class="wx-card-extra">UV Max: ${uv!=null?uv+' ('+uvLv(uv)+')':'—'}</span>
      </div>
    `;
  }

  async function fetchWeather(lat, lon, label) {
    try {
      const [wRes, gRes] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=apparent_temperature,relative_humidity_2m,precipitation_probability,visibility&daily=temperature_2m_max,temperature_2m_min,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=1`),
        label ? Promise.resolve(null) : fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
      ]);
      const w = await wRes.json();
      let place = label;
      if (!place && gRes) {
        const g = await gRes.json();
        const a = g.address ?? {};
        place = a.city||a.town||a.village||a.hamlet||a.suburb||a.county||'Your Location';
        if (a.state) place += ', ' + a.state;
      }
      renderWeather(w.current_weather, w.hourly, w.daily, place);
    } catch {
      document.getElementById('wx-loc').textContent = 'Search a city above';
      document.getElementById('wx-msg') && (document.getElementById('wx-msg').textContent = 'Could not load weather.');
    }
  }

  async function searchCity() {
    const val = document.getElementById('city-input').value.trim();
    if (!val) return;
    document.getElementById('wx-loc').textContent = 'Loading…';
    hideSug();
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(val)}`);
      const j = await r.json();
      if (!j.length) { document.getElementById('wx-loc').textContent = 'Not found'; return; }
      await fetchWeather(j[0].lat, j[0].lon, j[0].display_name.split(',')[0].trim());
    } catch { document.getElementById('wx-loc').textContent = 'Error'; }
  }

  document.getElementById('city-btn').addEventListener('click', searchCity);
  document.getElementById('city-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') { hideSug(); searchCity(); }
    if (e.key === 'Escape') hideSug();
  });

  const sugBox = document.getElementById('suggestions');
  let sugTimer;
  function hideSug() { sugBox.style.display='none'; sugBox.innerHTML=''; }
  document.addEventListener('click', e => { if (!e.target.closest('.wx-search')) hideSug(); });
  document.getElementById('city-input').addEventListener('input', () => {
    clearTimeout(sugTimer);
    const v = document.getElementById('city-input').value.trim();
    if (v.length < 2) { hideSug(); return; }
    sugTimer = setTimeout(async () => {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=6&addressdetails=1&q=${encodeURIComponent(v)}`);
        const results = await r.json();
        if (!results.length) { hideSug(); return; }
        sugBox.innerHTML = results.map((x,i) => {
          const a = x.address??{};
          const name = a.city||a.town||a.village||a.hamlet||a.suburb||x.display_name.split(',')[0];
          const detail = x.display_name.split(',').slice(1,4).join(',').trim();
          return `<div class="sug-item" data-i="${i}"><div class="sug-name">${name}</div><div class="sug-detail">${detail}</div></div>`;
        }).join('');
        sugBox.style.display = 'block';
        sugBox.querySelectorAll('.sug-item').forEach((el,i) => {
          el.addEventListener('click', () => {
            const x = results[i];
            const a = x.address??{};
            document.getElementById('city-input').value = a.city||a.town||a.village||a.hamlet||a.suburb||x.display_name.split(',')[0];
            hideSug();
            fetchWeather(x.lat, x.lon, document.getElementById('city-input').value);
          });
        });
      } catch { hideSug(); }
    }, 350);
  });

  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      pos => fetchWeather(pos.coords.latitude, pos.coords.longitude, null),
      ()  => { document.getElementById('wx-loc').textContent = 'Search a city above'; document.getElementById('wx-msg') && (document.getElementById('wx-msg').remove()); }
    );
  } else {
    document.getElementById('wx-loc').textContent = 'Search a city above';
  }
  </script>
</body>
</html>
