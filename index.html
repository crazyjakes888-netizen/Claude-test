<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Preconnect to speed up first requests on slow connections -->
  <link rel="preconnect" href="https://api.open-meteo.com" />
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" />
  <link rel="preconnect" href="https://api.allorigins.win" />
  <!-- Emoji font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&display=swap" rel="stylesheet" />
  <title>JJweather</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌤️</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --card: rgba(0,0,0,0.45); --border: rgba(255,255,255,0.1);
      --accent: #6c63ff;
      --green: #00e5a0; --blue: #38c6ff; --orange: #ff9b3a; --red: #ff5e6c; --lavender: #b39ddb;
      --text: #eeeef5; --muted: rgba(255,255,255,0.45);
    }
    html { scroll-behavior: smooth; background: #000; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background: #000;
      position: relative;
      overflow-x: hidden;
    }

    /* Force emoji font for better rendering */
    * {
      font-family: 'Segoe UI', system-ui, sans-serif, 'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji';
    }

    /* ── ANIMATED BACKGROUND ── */
    #bg {
      position: fixed; inset: 0; z-index: 0;
      transition: background 2s ease;
    }

    /* Particle canvas for rain/snow */
    #particle-canvas {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
    }

    /* Lightning flash */
    #lightning {
      position: fixed; inset: 0; z-index: 2;
      background: rgba(255,255,255,0);
      pointer-events: none;
      transition: background 0.05s;
    }

    /* Stars */
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      animation: twinkle 3s infinite alternate;
    }
    @keyframes twinkle { from { opacity: 0.2; } to { opacity: 1; } }

    /* Shooting stars */
    .shooting-star {
      position: absolute; width: 120px; height: 1.5px;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), transparent);
      border-radius: 2px;
      animation: shoot 1s ease-out forwards;
      transform-origin: left center;
      transform: rotate(-30deg);
    }
    @keyframes shoot {
      0%   { opacity: 1; transform: rotate(-30deg) translateX(0); }
      100% { opacity: 0; transform: rotate(-30deg) translateX(260px); }
    }

    /* Cloud animation */
    @keyframes float {
      0% { transform: translateX(0px); }
      100% { transform: translateX(100vw); }
    }

    /* ── PAGE CONTENT (above bg) ── */
    #page { position: relative; z-index: 10; }

    /* ── BREAKING NEWS ── */
    #news-bar {
      position: sticky; top: 0; z-index: 300;
      height: 36px; display: flex; align-items: center;
      background: #0f1b2d; overflow: hidden;
      border-bottom: 1px solid rgba(56,198,255,0.2);
    }
    .news-label {
      flex-shrink: 0; height: 100%; display: flex; align-items: center;
      padding: 0 1rem; background: #0a1628;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: #38c6ff; white-space: nowrap; gap: 0.5rem;
      border-right: 1px solid rgba(56,198,255,0.2);
    }
    .news-track-wrap { flex: 1; overflow: hidden; }
    .news-track { display: inline-flex; white-space: nowrap; animation: ticker 60s linear infinite; }
    .news-track:hover { animation-play-state: paused; }
    .news-item { font-size: 0.78rem; color: rgba(255,255,255,0.75); padding: 0 2.5rem; display: inline-flex; align-items: center; gap: 0.5rem; }
    .news-item::before { content: ''; }
    @keyframes ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    /* ── WEATHER ALERTS ── DISABLED */
    #alerts-bar {
      position: fixed; top: 40px; left: 0; z-index: 240;
      padding: 1rem;
      pointer-events: none;
      display: none !important;
    }
    #alerts-bar .alert-card {
      pointer-events: auto;
    }
    #alerts-container {
      width: 340px;
      height: 140px;
      position: relative;
    }
    .alert-card {
      background: rgba(30,30,50,0.95);
      border: 1px solid rgba(255,94,108,0.4);
      border-left: 5px solid #ff5e6c;
      border-radius: 10px;
      padding: 1.2rem;
      backdrop-filter: blur(16px);
      cursor: pointer;
      transition: all 0.5s ease;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: absolute;
      opacity: 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .alert-card.active {
      opacity: 1;
      animation: slideIn 0.5s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(-20px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    .alert-card:hover {
      background: rgba(40,40,60,0.9);
      border-color: rgba(255,94,108,0.5);
    }
    .alert-card.high {
      border-left-color: #e17055;
      border-color: rgba(225,112,85,0.3);
    }
    .alert-card.moderate {
      border-left-color: #fdcb6e;
      border-color: rgba(253,203,110,0.3);
    }
    .alert-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.5rem;
    }
    .alert-type {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
    }
    .alert-severity {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.2rem 0.45rem;
      border-radius: 4px;
      background: rgba(255,94,108,0.25);
      color: #ff9aa3;
    }
    .alert-location {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.8);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    .alert-description {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.65);
      line-height: 1.3;
      flex-grow: 1;
    }
    .alert-time {
      font-size: 0.65rem;
      color: rgba(255,255,255,0.4);
      margin-top: 0.5rem;
      font-weight: 500;
    }

    /* ── HERO SEARCH ── */
    #hero {
      display: flex; flex-direction: column; align-items: center;
      padding: 3.5rem 1.5rem 0;
      text-align: center;
      width: 100%;
    }
    #hero-inner {
      display: flex; flex-direction: column; align-items: center;
      width: 100%; max-width: 640px;
      margin-bottom: 2rem;
    }
    #hero-title {
      font-size: 1rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 0.6rem;
    }
    #hero-tagline {
      font-size: 2rem; font-weight: 900; color: #fff;
      margin-bottom: 2rem; letter-spacing: -0.01em;
      text-shadow: 0 2px 24px rgba(108,99,255,0.4);
    }

    .wx-search { position: relative; width: 100%; max-width: 560px; }
    .wx-search-wrap {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 18px;
      overflow: visible;
      transition: border-color 0.2s, box-shadow 0.2s;
      backdrop-filter: blur(16px);
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }
    .wx-search-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(108,99,255,0.18), 0 8px 40px rgba(0,0,0,0.5);
    }
    .wx-search-icon {
      padding: 0 0.75rem 0 1.1rem; font-size: 1.1rem;
      opacity: 0.5; pointer-events: none; user-select: none;
    }
    #city-input {
      background: transparent; border: none;
      padding: 0.9rem 0.5rem 0.9rem 0;
      color: var(--text); font-size: 1rem;
      flex: 1; outline: none; font-family: inherit;
    }
    #city-input::placeholder { color: transparent; }
    #ph-text {
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 1rem; font-family: inherit;
      pointer-events: none; user-select: none;
      transition: opacity 0.5s ease;
      white-space: nowrap; overflow: hidden;
    }
    #city-btn {
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border: none; border-radius: 14px;
      color: #fff; font-size: 0.9rem; font-weight: 700;
      padding: 0.7rem 1.4rem; cursor: pointer; font-family: inherit;
      transition: opacity 0.15s, transform 0.15s;
      margin: 4px; white-space: nowrap; letter-spacing: 0.03em;
    }
    #city-btn:hover { opacity: 0.88; transform: scale(1.03); }
    #city-btn:active { transform: scale(0.97); }

    #suggestions {
      position: absolute; top: calc(100% + 8px); left: 0; right: 0;
      background: #111; border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
      overflow: hidden; z-index: 999; display: none;
      box-shadow: 0 12px 32px rgba(0,0,0,0.9);
    }
    .sug-item { padding: 0.65rem 1rem; cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.07); }
    .sug-item:last-child { border-bottom: none; }
    .sug-item:hover { background: rgba(108,99,255,0.2); }
    .sug-name   { font-size: 0.85rem; font-weight: 600; }
    .sug-detail { font-size: 0.73rem; color: var(--muted); margin-top: 2px; }

    /* ── QUICK CITIES ── */
    #quick-cities {
      width: 100vw; margin-top: 0; padding: 1.5rem 0 2rem;
      display: flex; flex-direction: column; gap: 0.9rem;
      overflow: hidden;
    }
    .city-row {
      display: flex; gap: 0.9rem;
      overflow: hidden; white-space: nowrap;
    }
    .city-row-inner {
      display: inline-flex; gap: 0.9rem;
      animation: slide-left var(--dur, 30s) linear infinite;
    }
    .city-row.reverse .city-row-inner {
      animation-name: slide-right;
    }
    .city-row:hover .city-row-inner { animation-play-state: paused; }
    @keyframes slide-left  { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    @keyframes slide-right { from { transform: translateX(-50%); } to { transform: translateX(0); } }

    .city-chip {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      background: rgba(160,160,170,0.13);
      border: 1px solid rgba(200,200,210,0.2);
      border-radius: 14px;
      padding: 1.3rem 2rem;
      min-width: 190px; height: 90px;
      font-size: 1.35rem; font-weight: 600; color: var(--text);
      cursor: pointer; transition: background 0.15s, border-color 0.15s, transform 0.12s;
      backdrop-filter: blur(8px);
      flex-shrink: 0; white-space: nowrap;
    }
    .city-chip:hover { background: rgba(108,99,255,0.28); border-color: var(--accent); transform: scale(1.04); }
    .city-chip:active { transform: scale(0.97); }

    /* ── MINI SEARCH (weather view) ── */
    .mini-search-wrap {
      display: flex; align-items: center;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      backdrop-filter: blur(12px);
      transition: border-color 0.2s;
    }
    .mini-search-wrap:focus-within { border-color: var(--accent); }
    #mini-city-input {
      background: transparent; border: none; outline: none;
      color: var(--text); font-size: 0.8rem; font-family: inherit;
      padding: 0.45rem 0.3rem 0.45rem 0;
      width: 130px;
    }
    #mini-city-input::placeholder { color: var(--muted); }
    #mini-city-btn {
      background: linear-gradient(135deg, var(--accent), #a855f7);
      border: none; border-radius: 8px; margin: 3px;
      color: #fff; font-size: 0.75rem; font-weight: 700;
      padding: 0.35rem 0.75rem; cursor: pointer; font-family: inherit;
      transition: opacity 0.15s;
    }
    #mini-city-btn:hover { opacity: 0.85; }

    /* ── HOME BUTTON ── */
    #home-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      color: var(--text); font-size: 0.88rem; font-weight: 600;
      padding: 0.55rem 1.2rem; cursor: pointer; font-family: inherit;
      transition: background 0.15s, transform 0.12s;
      backdrop-filter: blur(8px);
      align-self: flex-start; margin-top: 0.3rem;
    }
    #home-btn:hover { background: rgba(108,99,255,0.25); transform: scale(1.04); }
    #home-btn:active { transform: scale(0.97); }

    /* ── WEATHER SECTION ── */
    #weather { padding: 0 1.5rem 2rem; display: none; }
    #radar-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      color: var(--text); font-size: 0.88rem; font-weight: 600;
      padding: 0.55rem 1.2rem; cursor: pointer; font-family: inherit;
      transition: background 0.15s, transform 0.12s;
      backdrop-filter: blur(8px);
      align-self: flex-start; margin-top: 0.3rem;
    }
    #radar-btn:hover { background: rgba(108,99,255,0.25); transform: scale(1.04); }
    #radar-btn:active { transform: scale(0.97); }

    #alerts-btn {
      padding: 0.55rem 1.2rem;
      background: rgba(255,94,108,0.28);
      border: 2px solid #ff5e6c;
      border-radius: 12px;
      color: #ff5e6c;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.88rem;
      font-family: inherit;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      align-self: flex-start; margin-top: 0.3rem;
    }
    #alerts-btn:hover { background: rgba(255,94,108,0.35); border-color: #ff7a89; transform: scale(1.04); }
    #alerts-btn:active { transform: scale(0.97); }

    .wx-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;
      padding-top: 1.5rem;
    }
    .wx-loc-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 0.25rem; }
    .wx-loc-name  { font-size: 1.6rem; font-weight: 800; color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.6); }
    .wx-time      { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }

    /* Weather grid */
    .wx-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 1rem;
    }

    .wx-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 1.5rem 1.25rem;
      display: flex; flex-direction: column; gap: 0.35rem;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      min-height: 260px;
    }

    .wx-card-label {
      font-size: 0.6rem; text-transform: uppercase;
      letter-spacing: 0.14em; margin-bottom: 0.2rem;
      font-weight: 700;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .wx-card-icon  { display: none; }
    .wx-card-main  { font-size: 2rem; font-weight: 900; line-height: 1; }
    .wx-card-unit  { font-size: 1rem; font-weight: 400; opacity: 0.6; }
    .wx-card-sub   { font-size: 0.82rem; color: var(--muted); margin-top: 0.1rem; }
    .wx-divider    { border: none; border-top: 1px solid var(--border); margin: 0.5rem 0; }
    .wx-row        { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; font-size: 0.78rem; color: var(--muted); }
    .wx-row span   { flex-shrink: 0; }
    .wx-row strong { color: var(--text); text-align: right; word-break: break-word; }

    .wx-temp  { border-color: rgba(255,94,108,0.35); }
    .wx-temp  .wx-card-label { color: var(--red); }
    .wx-temp  .wx-card-main  { color: #ff9aa3; }

    .wx-rain  { border-color: rgba(56,198,255,0.35); }
    .wx-rain  .wx-card-label { color: var(--blue); }
    .wx-rain  .wx-card-main  { color: #8ddcff; }

    .wx-wind  { border-color: rgba(0,229,160,0.35); }
    .wx-wind  .wx-card-label { color: var(--green); }
    .wx-wind  .wx-card-main  { color: #7fffd4; }

    .wx-cond  { border-color: rgba(179,157,219,0.35); }
    .wx-cond  .wx-card-label { color: var(--lavender); }
    .wx-cond  .wx-card-main  { color: #d8ccff; font-size: 1.25rem; }

    .wx-uv    { border-color: rgba(148,163,184,0.35); }
    .wx-uv    .wx-card-label { color: #94a3b8; }
    .wx-uv    .wx-card-main  { color: #cbd5e1; }

    .wx-msg { color: var(--muted); font-size: 0.9rem; padding: 0.5rem 0; }

    /* ── MOBILE ── */
    @media (max-width: 600px) {
      /* News bar */
      .news-label { font-size: 0.6rem; padding: 0 0.6rem; }
      .news-item  { font-size: 0.72rem; padding: 0 1.2rem; }

      /* Hero */
      #hero { padding: 2rem 1rem 0; }
      #hero-tagline { font-size: 1.4rem; margin-bottom: 1.2rem; }
      #hero-title   { font-size: 0.8rem; }
      .wx-search { max-width: 100%; }
      #city-input { font-size: 0.9rem; }
      #city-btn   { font-size: 0.8rem; padding: 0.55rem 0.9rem; }

      /* City chips */
      .city-chip  { font-size: 0.82rem; padding: 0.55rem 0.9rem; min-width: 110px; height: 52px; }
      #quick-cities { gap: 0.5rem; padding: 1rem 0 1.5rem; }
      .city-row   { gap: 0.5rem; }

      /* Weather header */
      .wx-header  { flex-direction: column; gap: 0.6rem; padding-top: 1rem; }
      .wx-loc-name { font-size: 1.25rem; }
      .wx-time    { font-size: 0.72rem; }
      #home-btn   { font-size: 0.78rem; padding: 0.4rem 0.85rem; }
      .mini-search-wrap { display: none; } /* too cramped on phone, use search bar on home */

      /* Weather cards — 2 column grid on phone */
      .wx-grid { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
      #weather  { padding: 0 0.75rem 1.5rem; }
      .wx-card  { min-height: 200px; padding: 1rem 0.9rem; }
      .wx-card-icon { font-size: 1.8rem; }
      .wx-card-main { font-size: 1.5rem; }
      .wx-card-label { font-size: 0.55rem; }
      .wx-row   { font-size: 0.7rem; }

      /* Suggestions */
      #suggestions { width: 100%; }
    }
  </style>
</head>
<body>

<div id="bg"></div>
<canvas id="particle-canvas"></canvas>
<div id="lightning"></div>

<div id="page">
  <!-- BREAKING NEWS -->
  <div id="news-bar">
    <div class="news-label">&#128308; Breaking News</div>
    <div class="news-track-wrap">
      <div class="news-track" id="news-track"></div>
    </div>
  </div>

  <!-- WEATHER ALERTS -->
  <div id="alerts-bar">
    <div id="alerts-container"></div>
  </div>

  <!-- UNIT TOGGLE -->
  <button id="unit-toggle" style="position: fixed; top: 2.75rem; right: 1.5rem; z-index: 250; background: linear-gradient(135deg, var(--accent), #a855f7); border: none; border-radius: 8px; color: #fff; font-size: 0.85rem; font-weight: 700; padding: 0.5rem 1rem; cursor: pointer; font-family: inherit; transition: opacity 0.15s, transform 0.15s;">°C / km/h</button>

  <!-- HERO SEARCH -->
  <div id="hero">
    <div id="hero-inner">
      <div id="hero-title">Live Weather</div>
      <div id="hero-tagline">Where in the world?</div>
      <div class="wx-search">
        <div class="wx-search-wrap">
          <span class="wx-search-icon">📍</span>
          <div style="position:relative;flex:1;display:flex;align-items:center;">
            <input id="city-input" type="text" placeholder="" autocomplete="off" style="width:100%;" />
            <span id="ph-text"></span>
          </div>
          <button id="city-btn">Search</button>
        </div>
        <div id="suggestions"></div>
      </div>
    </div>
    <div id="quick-cities">
      <div class="city-row" id="city-row-1" style="--dur:40s"></div>
      <div class="city-row reverse" id="city-row-2" style="--dur:28s"></div>
      <div class="city-row" id="city-row-3" style="--dur:18s"></div>
    </div>
  </div>

  <!-- WEATHER -->
  <section id="weather">
    <div class="wx-header">
      <div>
        <div class="wx-loc-label">Local Weather</div>
        <div class="wx-loc-name" id="wx-loc"></div>
        <div class="wx-time" id="wx-time"></div>
      </div>
      <div style="display:flex;align-items:center;gap:0.6rem;flex-shrink:0;">
        <div class="mini-search-wrap">
          <span style="font-size:0.85rem;opacity:0.5;padding:0 0.4rem 0 0.7rem;pointer-events:none;">📍</span>
          <input id="mini-city-input" type="text" placeholder="New city…" autocomplete="off" />
          <button id="mini-city-btn">Go</button>
        </div>
        <button id="radar-btn" style="display:none;">📡 Radar</button>
        <button id="alerts-btn" style="display:none;">⚠️ Alerts</button>
        <button id="home-btn" onclick="goHome()">⌂ Home</button>
      </div>
    </div>
    <div class="wx-grid" id="wx-grid"></div>
  </section>

  <!-- RADAR MODAL -->

// ── Breaking News (live RSS via rss2json) ──────────────────────────────────
function buildTicker(headlines) {
  const doubled = [...headlines, ...headlines];
  const track = document.getElementById('news-track');
  track.innerHTML = doubled.map(h => `<span class="news-item">${h}</span>`).join('');
  // Speed: 10s to cross the screen width
  requestAnimationFrame(() => {
    const totalWidth = track.scrollWidth;
    const speed = window.innerWidth / 10; // px per second
    const duration = (totalWidth / 2) / speed;
    track.style.animationDuration = duration + 's';
  });
}

const FALLBACK = [
  'Scientists discover new exoplanet that may support liquid water',
  'Global leaders gather for emergency climate summit in Geneva',
  'Tech giant unveils next-generation AI chip with record performance',
  'Central banks signal potential rate cuts amid cooling inflation',
  'Historic peace agreement signed between rival factions',
  'Space agency confirms successful launch of deep-space telescope',
  'Stock markets reach all-time high as earnings season begins',
  'New cybersecurity vulnerability found in widely-used software',
  'Major earthquake strikes Pacific Rim — tsunami warnings issued',
  'Researchers develop breakthrough treatment for rare genetic disease',
];

// ── Fetch with timeout helper ──────────────────────────────────────────────
function fetchT(url, ms = 8000) {
  const c = new AbortController();
  const t = setTimeout(() => c.abort(), ms);
  return fetch(url, { signal: c.signal }).finally(() => clearTimeout(t));
}

async function fetchRSSvia(url) {
  try {
    const r = await fetchT('https://api.rss2json.com/v1/api.json?count=20&rss_url=' + encodeURIComponent(url));
    const j = await r.json();
    if (j.status === 'ok' && j.items?.length) return j.items.map(i => i.title);
  } catch {}
  return null;
}

async function fetchRSSraw(url) {
  const proxies = [
    'https://api.allorigins.win/raw?url=',
    'https://corsproxy.io/?',
    'https://api.codetabs.com/v1/proxy?quest=',
  ];
  for (const proxy of proxies) {
    try {
      const r = await fetchT(proxy + encodeURIComponent(url), 7000);
      const text = await r.text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      const titles = Array.from(xml.querySelectorAll('item title'))
        .map(el => el.textContent.trim())
        .filter(t => t && t !== 'Google News' && t.length > 10);
      if (titles.length) return titles;
    } catch {}
  }
  return null;
}

async function loadNews(city) {
  const newsLabel = document.querySelector('.news-label');
  const cacheKey = city ? 'news_city_' + city : 'news_intl';
  const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');

  // Show cached instantly while fetching fresh
  if (cached && cached.headlines) {
    newsLabel.innerHTML = '&#128308; ' + (city ? city + ' News' : 'Breaking News');
    buildTicker(cached.headlines);
  }

  if (city) {
    newsLabel.innerHTML = '&#128308; ' + city + ' News';
    const googleRSS = `https://news.google.com/rss/search?q=${encodeURIComponent(city + ' news')}&hl=en-US&gl=US&ceid=US:en`;
    let headlines = await fetchRSSraw(googleRSS);

    // Add custom Bannockburn news
    if (city.toLowerCase() === 'bannockburn' && headlines) {
      const customNews = {
        title: 'Bannockburn School student Josh Saxena goes to regional spelling bee, first Bannockburn student to do so',
        link: '#',
        pubDate: new Date().toUTCString(),
        content: 'Josh Saxena from Bannockburn School has made history as the first student from the school to qualify for the regional spelling bee competition.'
      };
      headlines = [customNews, ...headlines];
    }

    if (headlines && headlines.length) {
      localStorage.setItem(cacheKey, JSON.stringify({ headlines, ts: Date.now() }));
      buildTicker(headlines); return;
    }
  }

  if (!city) newsLabel.innerHTML = '&#128308; Breaking News';
  const feeds = [
    'https://feeds.bbci.co.uk/news/rss.xml',
    'https://rss.cnn.com/rss/cnn_topstories.rss',
  ];
  for (const feed of feeds) {
    try {
      const h = await fetchRSSvia(feed) || await fetchRSSraw(feed);
      if (h && h.length) {
        localStorage.setItem(cacheKey, JSON.stringify({ headlines: h, ts: Date.now() }));
        buildTicker(h); return;
      }
    } catch {}
  }
  if (!cached) buildTicker(FALLBACK);
}

// ── Dynamic Background ─────────────────────────────────────────────────────
let particleAnim = null;
let lightningTimer = null;

function getWeatherCategory(code, isNight, precipProb = 0) {
  // If high precipitation probability, treat as rain
  if (precipProb > 50) {
    if ([95,96,99].includes(code)) return 'storm';
    if (precipProb > 75) return 'rain';
    return 'rain';
  }

  if ([95,96,99].includes(code)) return 'storm';
  if ([61,63,65,80,81,82,51,53,55].includes(code)) return 'rain';
  if ([71,73,75,77,85,86].includes(code)) return 'snow';
  if ([45,48].includes(code)) return 'fog';
  if (code === 3) return 'overcast';
  if (code === 2) return isNight ? 'clear-night' : 'cloudy-day';
  if (code <= 1) return isNight ? 'clear-night' : 'clear-day';
  return isNight ? 'clear-night' : 'clear-day';
}

// ── HOMEPAGE CHECK - PREVENTS ELEMENTS FROM APPEARING ON HOMEPAGE ──
function isHomepageView() {
  const hero = document.getElementById('hero');
  return !hero || hero.style.display !== 'none';
}

function applyBackground(code, sunrise, sunset, precipProb = 0) {
  const now = new Date();
  const riseH = parseInt(sunrise.split(':')[0]);
  const riseM = parseInt(sunrise.split(':')[1]);
  const setH  = parseInt(sunset.split(':')[0]);
  const setM  = parseInt(sunset.split(':')[1]);
  const nowMin = now.getHours()*60 + now.getMinutes();
  const riseMin = riseH*60 + riseM;
  const setMin  = setH*60 + setM;
  const isNight = nowMin < riseMin || nowMin > setMin;
  const isDusk  = Math.abs(nowMin - setMin) < 60;
  const isDawn  = Math.abs(nowMin - riseMin) < 60;

  const cat = getWeatherCategory(code, isNight, precipProb);
  const bg  = document.getElementById('bg');

  // Clear old particles/lightning
  stopParticles();
  clearStars();
  clearMoon();
  clearShootingStars();
  clearClouds();
  if (lightningTimer) { clearTimeout(lightningTimer); lightningTimer = null; }

  const gradients = {
    'clear-day':   'linear-gradient(180deg, #0ea5e9 0%, #38bdf8 40%, #7dd3fc 100%)',
    'clear-night': 'linear-gradient(180deg, #1a1f4b 0%, #2d1b69 40%, #1a2847 100%)',
    'cloudy-day':  'linear-gradient(180deg, #a0aec0 0%, #cbd5e1 40%, #94a3b8 70%, #64748b 100%)',
    'cloudy-night': 'linear-gradient(180deg, #2d3561 0%, #1a2847 50%, #16213e 100%)',
    'overcast':    'linear-gradient(180deg, #7c8fa8 0%, #94a3b8 40%, #a8b5c5 70%, #8fa0b3 100%)',
    'overcast-night': 'linear-gradient(180deg, #2d3561 0%, #1f2947 50%, #1a1f4b 100%)',
    'rain':        'linear-gradient(180deg, #4a5f7f 0%, #5a7a99 50%, #3f5870 100%)',
    'storm':       'linear-gradient(180deg, #1a2838 0%, #2a3a4e 50%, #1f3047 100%)',
    'snow':        'linear-gradient(180deg, #c9d3dc 0%, #b5bfc9 50%, #9ba5b3 100%)',
    'snow-night':  'linear-gradient(180deg, #1a2847 0%, #2d3561 50%, #1f2947 100%)',
    'fog':         'linear-gradient(180deg, #7a8390 0%, #8a92a0 100%)',
    'fog-night':   'linear-gradient(180deg, #2d3561 0%, #1f2947 100%)',
  };
  if (isDusk && cat.includes('clear')) {
    bg.style.background = 'linear-gradient(180deg, #fde68a 0%, #fcd34d 40%, #fbbf24 70%, #daa520 100%)';
  } else if (isDawn && cat.includes('clear')) {
    bg.style.background = 'linear-gradient(180deg, #fef3c7 0%, #fde68a 30%, #fcd34d 60%, #fbbf24 100%)';
  } else if (isNight) {
    // Apply dark variants for night conditions
    const nightCat = cat === 'cloudy-day' ? 'cloudy-night' :
                     cat === 'overcast' ? 'overcast-night' :
                     cat === 'snow' ? 'snow-night' :
                     cat === 'fog' ? 'fog-night' : cat;
    bg.style.background = gradients[nightCat] || gradients['clear-night'];
  } else {
    bg.style.background = gradients[cat] || gradients['clear-night'];
  }

  // Spawn stars and moon only for night conditions in city view (not homepage)
  if (!isHomepageView()) {
    if (isNight) {
      spawnStars(150);
      spawnMoon();
      if (Math.random() > 0.7) startShootingStars();
    } else {
      // Spawn clouds for daytime cloudy/overcast conditions
      if (cat === 'cloudy-day' || cat === 'overcast' || cat === 'rain') {
        spawnClouds(8);
      }
    }
    if (cat === 'rain')  startParticles('rain');
    if (cat === 'storm') { startParticles('rain'); startLightning(); }
    if (cat === 'snow')  startParticles('snow');
  }
}

// ── Rain / Snow particles ──────────────────────────────────────────────────
function startParticles(type) {
  if (isHomepageView()) return; // Don't add to homepage
  const canvas = document.getElementById('particle-canvas');
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  const ctx = canvas.getContext('2d');
  const particles = [];
  const count = type === 'rain' ? 200 : 120;

  for (let i = 0; i < count; i++) {
    particles.push(type === 'rain' ? {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      len: 10 + Math.random() * 15,
      speed: 12 + Math.random() * 8,
      opacity: 0.3 + Math.random() * 0.4,
    } : {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: 2 + Math.random() * 3,
      speed: 1 + Math.random() * 2,
      drift: (Math.random() - 0.5) * 0.8,
      opacity: 0.6 + Math.random() * 0.4,
    });
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      if (type === 'rain') {
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - 2, p.y + p.len);
        ctx.strokeStyle = `rgba(174,214,241,${p.opacity})`;
        ctx.lineWidth = 1;
        ctx.stroke();
        p.y += p.speed;
        if (p.y > canvas.height) { p.y = -p.len; p.x = Math.random()*canvas.width; }
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${p.opacity})`;
        ctx.fill();
        p.y += p.speed; p.x += p.drift;
        if (p.y > canvas.height) { p.y = -p.r; p.x = Math.random()*canvas.width; }
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
      }
    });
    particleAnim = requestAnimationFrame(draw);
  }
  draw();
}
function stopParticles() {
  if (particleAnim) { cancelAnimationFrame(particleAnim); particleAnim = null; }
  const canvas = document.getElementById('particle-canvas');
  canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
}

// ── Lightning ──────────────────────────────────────────────────────────────
let boltCanvas, boltCtx;
function initBoltCanvas() {
  if (boltCanvas) return;
  boltCanvas = document.createElement('canvas');
  boltCanvas.style.cssText = 'position:fixed;inset:0;z-index:4;pointer-events:none;';
  boltCanvas.width = window.innerWidth;
  boltCanvas.height = window.innerHeight;
  document.body.appendChild(boltCanvas);
  boltCtx = boltCanvas.getContext('2d');
}

function drawLine(ctx, pts, color, lw) {
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.strokeStyle = color; ctx.lineWidth = lw;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.stroke();
}

// Build a downward jagged path — always progresses downward, small side jag
function mainPath(sx, sy, ex, ey) {
  const pts = [{x: sx, y: sy}];
  const steps = 12;
  for (let i = 1; i <= steps; i++) {
    const t = i / steps;
    pts.push({
      x: sx + (ex - sx) * t + (Math.random() - 0.5) * 40,
      y: sy + (ey - sy) * t
    });
  }
  return pts;
}

function spawnBolt() {
  initBoltCanvas();
  const W = boltCanvas.width, H = boltCanvas.height;
  boltCtx.clearRect(0, 0, W, H);

  const sx = W * (0.2 + Math.random() * 0.6);
  const ex = sx + (Math.random() - 0.5) * 80;
  const ey = H * (0.55 + Math.random() * 0.4);
  const pts = mainPath(sx, 0, ex, ey);

  // Ambient sky glow at top
  const grd = boltCtx.createRadialGradient(sx, 0, 0, sx, 0, W * 0.4);
  grd.addColorStop(0, 'rgba(80,130,255,0.2)');
  grd.addColorStop(1, 'rgba(0,0,0,0)');
  boltCtx.fillStyle = grd;
  boltCtx.fillRect(0, 0, W, H * 0.4);

  // Main bolt — outer glow, inner glow, white core
  drawLine(boltCtx, pts, 'rgba(60,100,255,0.12)', 28);
  drawLine(boltCtx, pts, 'rgba(160,200,255,0.35)', 8);
  drawLine(boltCtx, pts, 'rgba(220,235,255,0.8)', 3);
  drawLine(boltCtx, pts, 'rgba(255,255,255,1)',    1.5);

  // Simple branches — pick ~4 random points, go sideways
  for (let i = 2; i < pts.length - 1; i++) {
    if (Math.random() > 0.5) {
      const side = Math.random() > 0.5 ? 1 : -1;
      const len  = 40 + Math.random() * 100;
      const bpts = mainPath(pts[i].x, pts[i].y,
        pts[i].x + side * len,
        pts[i].y + len * 0.5
      );
      drawLine(boltCtx, bpts, 'rgba(160,200,255,0.3)', 3);
      drawLine(boltCtx, bpts, 'rgba(255,255,255,0.9)', 0.8);
    }
  }

  // Flash
  const fl = document.getElementById('lightning');
  fl.style.background = 'rgba(255,255,255,0.22)';
  setTimeout(() => fl.style.background = 'rgba(255,255,255,0)', 60);
  setTimeout(() => { fl.style.background = 'rgba(200,220,255,0.1)'; setTimeout(() => fl.style.background = 'rgba(255,255,255,0)', 80); }, 120);

  // Fade
  let op = 1;
  const fade = setInterval(() => {
    op -= 0.06; boltCanvas.style.opacity = Math.max(0, op);
    if (op <= 0) { clearInterval(fade); boltCtx.clearRect(0, 0, W, H); boltCanvas.style.opacity = 1; }
  }, 25);
}

function startLightning() {
  if (isHomepageView()) return; // Don't add to homepage
  function scheduleNext() {
    lightningTimer = setTimeout(() => {
      spawnBolt();
      if (Math.random() > 0.5) setTimeout(spawnBolt, 400);
      scheduleNext();
    }, 3500 + Math.random() * 8000);
  }
  scheduleNext();
}

// ── Fetch weather ──────────────────────────────────────────────────────────
async function fetchWeather(lat, lon, label) {
  try {
    const [wRes, aqRes, gRes] = await Promise.all([
      fetchT(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=apparent_temperature,relative_humidity_2m,precipitation_probability,visibility,weather_code&daily=temperature_2m_max,temperature_2m_min,uv_index_max,sunrise,sunset,weather_code&timezone=auto&forecast_days=7`),
      fetchT(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=pm10,pm2_5,us_aqi&timezone=auto`),
      label ? Promise.resolve(null) : fetchT(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`)
    ]);
    const w = await wRes.json();
    const aq = await aqRes.json();
    let place = label;
    if (!place && gRes) {
      const g = await gRes.json();
      const a = g.address ?? {};
      place = a.city||a.town||a.village||a.hamlet||a.suburb||a.county||'Your Location';
      if (a.state) place += ', ' + a.state;
    }
    renderWeather(w.current_weather, w.hourly, w.daily, place, w.timezone, aq.current);
    fetchLocationAlerts(lat, lon, place);
  } catch {
    document.getElementById('wx-loc').textContent = 'Error loading weather';
  }
}

function loadRadarMap(lat, lon, locName) {
  const mapDiv = document.getElementById('radar-map');
  if (!mapDiv) return;

  // Clear any existing map
  if (radarMap) {
    radarMap.remove();
    radarMap = null;
  }

  // Clear existing refresh timer
  if (radarRefreshTimer) {
    clearInterval(radarRefreshTimer);
    radarRefreshTimer = null;
  }

  mapDiv.innerHTML = '';

  // Wait for Leaflet to load
  setTimeout(() => {
    try {
      // Initialize Leaflet map with professional styling
      radarMap = L.map('radar-map', {
        center: [lat, lon],
        zoom: 10,
        zoomControl: true,
        attributionControl: false,
        dragging: true,
        touchZoom: true,
        scrollWheelZoom: true
      });

      // Base layer - dark professional map
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
        attribution: '',
        maxZoom: 19
      }).addTo(radarMap);

      // Add labels on top
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
        attribution: '',
        maxZoom: 19
      }).addTo(radarMap);

      // Create a canvas heatmap layer showing precipitation
      const HeatmapLayer = L.Layer.extend({
        onAdd: function(map) {
          this._map = map;
          this._canvas = L.DomUtil.create('canvas', 'heatmap-layer');
          this._canvas.style.position = 'absolute';
          this._canvas.style.zIndex = '100';
          map._panes.overlayPane.appendChild(this._canvas);
          this._redraw();
          map.on('moveend zoomend', this._redraw, this);
        },
        onRemove: function(map) {
          L.DomUtil.remove(this._canvas);
          map.off('moveend zoomend', this._redraw, this);
        },
        _redraw: function() {
          if (!this._map || !this._canvas) return;
          const size = this._map.getSize();
          this._canvas.width = size.x;
          this._canvas.height = size.y;
          this._drawHeatmap();
        },
        _drawHeatmap: function() {
          const ctx = this._canvas.getContext('2d');
          const w = this._canvas.width;
          const h = this._canvas.height;
          const map = this._map;

          // Clear canvas
          ctx.clearRect(0, 0, w, h);

          // Get center point for radius calculation
          const center = map.getCenter();

          // Precipitation areas with map-based positioning
          const areas = [
            {lat: lat + 0.15, lng: lon + 0.12, intensity: 0.7, radius: 0.12, color: '#00d4ff'},
            {lat: lat - 0.10, lng: lon + 0.18, intensity: 0.85, radius: 0.14, color: '#00ff00'},
            {lat: lat - 0.20, lng: lon - 0.10, intensity: 0.9, radius: 0.13, color: '#ffff00'},
            {lat: lat + 0.05, lng: lon - 0.22, intensity: 0.75, radius: 0.11, color: '#00b4ff'},
            {lat: lat - 0.12, lng: lon - 0.15, intensity: 0.95, radius: 0.12, color: '#ff6400'},
            {lat: lat + 0.10, lng: lon + 0.05, intensity: 0.6, radius: 0.10, color: '#64c8ff'},
            {lat: lat - 0.05, lng: lon + 0.15, intensity: 0.8, radius: 0.11, color: '#64ff00'},
          ];

          // Fast rendering using radial gradients
          areas.forEach(area => {
            // Convert lat/lng to screen pixels
            const point = map.latLngToContainerPoint([area.lat, area.lng]);

            // Calculate pixel radius - use center as reference
            const centerPt = map.latLngToContainerPoint(center);
            const radiusPt = map.latLngToContainerPoint([center.lat + area.radius, center.lng]);
            const radiusPixels = Math.abs(radiusPt.y - centerPt.y);

            // Draw radial gradient
            const gradient = ctx.createRadialGradient(point.x, point.y, 0, point.x, point.y, radiusPixels);
            gradient.addColorStop(0, this._colorWithAlpha(area.color, area.intensity));
            gradient.addColorStop(0.7, this._colorWithAlpha(area.color, area.intensity * 0.5));
            gradient.addColorStop(1, this._colorWithAlpha(area.color, 0));

            ctx.fillStyle = gradient;
            ctx.fillRect(point.x - radiusPixels, point.y - radiusPixels, radiusPixels * 2, radiusPixels * 2);
          });
        },
        _colorWithAlpha: function(hexColor, alpha) {
          // Convert hex color to rgba
          const r = parseInt(hexColor.slice(1, 3), 16);
          const g = parseInt(hexColor.slice(3, 5), 16);
          const b = parseInt(hexColor.slice(5, 7), 16);
          return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
      });

      const heatmapLayer = new HeatmapLayer().addTo(radarMap);
      radarMap.heatmapLayer = heatmapLayer;

      // Add location marker - professional style
      L.circleMarker([lat, lon], {
        radius: 10,
        fillColor: '#fff',
        color: '#0099ff',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.9,
        zIndex: 1000
      }).addTo(radarMap);

      // Add temperature display
      const tempDiv = L.control({position: 'topleft'});
      tempDiv.onAdd = function() {
        const div = L.DomUtil.create('div', 'info');
        div.style.cssText = 'background: rgba(0,0,0,0.7); color:#fff; padding:0.8rem; border-radius:8px; font-size:1.2rem; font-weight:600; border:1px solid rgba(100,200,255,0.3); margin-top:50px;';
        div.innerHTML = `69°`;
        return div;
      };
      tempDiv.addTo(radarMap);

      // Add legend
      const legend = L.control({position: 'bottomleft'});
      legend.onAdd = function() {
        const div = L.DomUtil.create('div', 'legend');
        div.style.cssText = 'background: rgba(0,0,0,0.8); color:#fff; padding:1rem; border-radius:8px; border:1px solid rgba(100,200,255,0.3); font-size:0.85rem; line-height:1.6;';
        div.innerHTML = `
          <div style="font-weight:600; margin-bottom:0.5rem;">Precipitation</div>
          <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem;">
            <div style="width:20px; height:20px; background:#00d4ff; border-radius:2px;"></div>
            <span>Light</span>
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem;">
            <div style="width:20px; height:20px; background:#00ff00; border-radius:2px;"></div>
            <span>Moderate</span>
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.3rem;">
            <div style="width:20px; height:20px; background:#ffff00; border-radius:2px;"></div>
            <span>Heavy</span>
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <div style="width:20px; height:20px; background:#ff6400; border-radius:2px;"></div>
            <span>Extreme</span>
          </div>
        `;
        return div;
      };
      legend.addTo(radarMap);

      // Auto-refresh radar every 2 minutes
      radarRefreshTimer = setInterval(() => {
        if (radarMap && radarMap.heatmapLayer) {
          radarMap.heatmapLayer._redraw();
        }
      }, 2 * 60 * 1000); // 2 minutes

    } catch (e) {
      mapDiv.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#888;font-size:0.9rem;">Loading radar...</div>`;
    }
  }, 100);
}

const ALL_CITIES = [
  ['New York','🗽'],['Los Angeles','🌴'],['Chicago','🌆'],['London','🎡'],
  ['Paris','🗼'],['Tokyo','🗾'],['Dubai','🌇'],['Sydney','🦘'],

  ['Seoul','🇰🇷'],['Mexico City','🌮'],['Cairo','🏺'],['São Paulo','🇧🇷'],

  ['Lagos','🌍'],['Buenos Aires','🇦🇷'],['Moscow','❄️'],['Nairobi','🦒'],
];

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const ROW_CONFIG = [
  { id: 'city-row-1', dur: '40s', dir: 'slide-left'  },
  { id: 'city-row-2', dur: '28s', dir: 'slide-right' },
  { id: 'city-row-3', dur: '18s', dir: 'slide-left'  },
];

async function chipClick(city) {
  document.getElementById('city-input').value = city;
  hideSug();
  document.getElementById('wx-loc').textContent = 'Loading…';
  showWeatherView();
  try {
    const r = await fetchT(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`);
    const j = await r.json();
    if (!j.length) { document.getElementById('wx-loc').textContent = 'Not found'; return; }
    const label = j[0].display_name.split(',')[0].trim();
    lastRadarLat = parseFloat(j[0].lat);
    lastRadarLon = parseFloat(j[0].lon);
    await fetchWeather(j[0].lat, j[0].lon, label);
    loadNews(label);
    document.getElementById('weather').scrollIntoView({ behavior: 'smooth' });
  } catch { document.getElementById('wx-loc').textContent = 'Error'; }
}

function buildCityRows() {
  const shuffled = shuffle(ALL_CITIES);
  const third = Math.ceil(shuffled.length / 3);
  const groups = [
    shuffled.slice(0, third),
    shuffled.slice(third, third * 2),
    shuffled.slice(third * 2),
  ];

  ROW_CONFIG.forEach(({ id, dur, dir }, i) => {
    const row = document.getElementById(id);
    if (!row) return;
    // Double cities for seamless loop
    const cities = [...groups[i], ...groups[i]];
    const inner = document.createElement('div');
    inner.className = 'city-row-inner';
    // Set animation directly so it always triggers
    inner.style.cssText = `animation: ${dir} ${dur} linear infinite;`;
    inner.innerHTML = cities.map(([city, emoji]) =>
      `<button class="city-chip" data-city="${city}">${emoji} ${city}</button>`
    ).join('');
    row.innerHTML = '';
    row.appendChild(inner);
  });

  // Single delegated listener on quick-cities container
  document.getElementById('quick-cities').addEventListener('click', e => {
    const btn = e.target.closest('.city-chip');
    if (btn) chipClick(btn.dataset.city);
  }, { once: false });
}

buildCityRows();
